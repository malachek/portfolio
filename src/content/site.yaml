      md: |-
        An explorer and an achiever: I want to see every corner of a world, then master it.

        **Top 5:** Superliminal, The Elder Scrolls V: Skyrim, Portal, What Remains of Edith Finch, League of Legends.

        **All-time favorites:** Genshin Impact, Tomb Raider (2013), Tony Hawk's Downhill Jam, Fortnite, Hades, Hollow Knight, Baba Is You, Firewatch, and Virginia.
      photos:
          - src: /art/about/pc-build.webp
            alt: "A newly built PC with an RTX graphics card and RGB lighting beside a backlit keyboard"
            caption: The rig
  whyHeading: Why Games?
  whyBlocks:
    - id: why-text
      type: text
      md: |-
        Games are the one medium that uses everything I love. I grew up in art classes, chess club, and a lot of instruments (I still play piano, and bass clarinet in UCI's Euphonic Video Game Ensemble). I took every coding class I could (CS track, cybersecurity club, robotics), made short films and wrote scripts, and picked up information design from my mom.

        And I made games the whole way through... papercraft, Kano on a Raspberry Pi, Scratch (including a working cardboard DDR machine on Makey Makeys), BlueJ, Pygame, Unity, then Unreal, plus more GDDs than I can count.

        That's why gameplay engineering fits me. I have a strong technical foundation with a designer's mind, so the systems I build work, feel intuitive, and are fun. I'm involved in every area of a project, and I trust my intuition.
