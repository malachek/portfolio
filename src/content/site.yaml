# About page (same on every role site). Photos live in public/art/about/.
# Written for every reader: nothing here is aimed at one studio.
about:
  heading: About
  description: Malachy Kennedy, game engineer and designer at UC Irvine, co-founder of Burnt Out Games, LLC and President of the Video Game Development Club at UC Irvine.
  portrait:
    src: /art/about/portrait.webp
    alt: Malachy Kennedy
  intro:
    - My name is Malachy Kennedy, a double major in Game Design and Software Engineering at UC Irvine. I fell in love with game development at the age of 5 and have chased that passion ever since.
    - "Two ways I am applying that drive: Burnt Out Games, LLC, the studio I co-founded, where I engineer our Unreal and Unity titles alongside 10 brilliant developers (two shipped on Steam, a third approved), and the Video Game Development Club at UC Irvine, where I'm President and 600+ members make games together every year."
    - "As a player I'm an explorer and an achiever: I want to see every corner of a world, then master it. My favorites span story, adventure, action and puzzle, and each one gave me something I couldn't have gotten anywhere else."
  whyHeading: Why Games
  why:
    - "I played Tomb Raider (2013) over a winter break, and the moment the credits rolled and showed the team photos, I knew: \"I need to be on a team like that.\""
    - Games like Superliminal, Portal and What Remains of Edith Finch are why I love this medium. I stepped into each of those worlds and it answered back in a way only a game can, and that's what I want to spend my career making.
    - "Next, I want to learn and get involved in everything I possibly can: working with talented people on bigger projects, building industry-standard workflows and skills, and meeting the community that made me fall in love with games in the first place."
  profileHeading: Player Profile
  profile:
