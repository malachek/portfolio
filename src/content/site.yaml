about:
  heading: About
  description: Malachy Kennedy, game engineer and designer at UC Irvine, co-founder of Burnt Out Games, LLC and President of the Video Game Development Club at UC Irvine.
  portrait:
    src: /art/about/portrait.webp
    alt: Malachy Kennedy
  intro:
    - I'm Malachy Kennedy and I love making games. I fell in love with game development at 5, and have chased it ever since.
  portfoliosText: "See my other portfolios, each tailored to a role:"
  rows:
    - title: Developing
      md: |-
        3 games on Steam and 20+ game projects, built by following the fun.

        I experiment in Unreal to make things that haven't been made, especially game feel through camerawork and systems, and I keep up with the newest engine versions and AI tools.
      photos:
        - src: /art/about/bog-booth.webp
          alt: "Malachy and two Burnt Out Games teammates pointing at the logo on their shirts at the Z3 Student Games Showcase, with EXO running"
          caption: EXO at the Z3 Student Games Showcase
        - src: /art/about/unreal-claude.webp
          alt: "A laptop running Unreal Editor beside a monitor with a Claude Code terminal connected to the editor, during Masks On"
          caption: Unreal x Claude (Masks On)
        - src: /art/about/late-night-dev.webp
          alt: "Teammates working on EXO on laptops around a kitchen table at night"
          caption: Late-night devving on EXO
    - title: Leading
      md: |-
        President of VGDC at UCI, which I grew into North America's largest collegiate game dev club: 600+ active members, 44 officers, and 200+ workshops a year. I'm working to make it a nonprofit.

        I also co-founded Burnt Out Games, LLC, where I lead tech.
      photos:
        - src: /art/about/vgdc-meeting.webp
          alt: "Malachy presenting the workshop departments to a full lecture hall at a VGDC general meeting"
          caption: Leading a VGDC general meeting
        - src: /art/about/vgdc-booth.webp
          alt: "Malachy handing out flyers at the VGDC booth, beside a tier list board of games"
          caption: VGDC boothing
        - src: /art/about/vgdc-riot.webp
          alt: "A group selfie of Burnt Out Games and EXO contributors in front of the Riot Games sign"
          caption: Burnt Out Games and EXO contributors at Riot
    - title: Studying
      md: |-
        Game Design and Software Engineering at UC Irvine, with a 3.73 major GPA. My favorite classes have been Games Engineering, Storytelling in Interactive Media, and Games and Emotion.

        I'm also a course reader for a game design class every quarter.
      photos:
        - src: /art/about/exo-expo.webp
